services:
  - type: web
    name: prod-langchain-agent
    runtime: python
    region: oregon
    plan: free

    buildCommand: pip install uv && uv sync --frozen --no-dev --no-install-project

    startCommand: .venv/bin/uvicorn app.main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: GEMINI_API_KEY
        sync: false

      - key: LANGCHAIN_TRACING_V2
        value: "true"

      - key: LANGCHAIN_API_KEY
        sync: false

      - key: LANGCHAIN_PROJECT
        value: production-api

      - key: API_ENV
        value: production

      - key: LOG_LEVEL
        value: INFO

      - key: RATE_LIMIT
        value: "20"

      - key: CACHE_TTL_SECONDS
        value: "300"

      - key: MAX_RETRIES
        value: "3"

    healthCheckPath: /health

    autoDeployTrigger: commit